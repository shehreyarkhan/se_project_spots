<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A social media web application where users can add and remove photos, like photos of other users, and make a few minor adjustments to their profile."
    />
    <meta name="author" content="Shehreyar Khan" />
    <meta
      name="keywords"
      content="Best Spots in NYC, social media, web application, grids, flexbox"
    />
    <title>Spots</title>
    <!-- Connect favicon -->
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/Logo.svg')%>"
          alt="Spots logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button id="profile__avatar-btn" class="profile__avatar-btn">
              <img
                type="url"
                src="<%=require('./images/pencil-white.svg')%>"
                alt="Pencil icon"
                class="profile__pencil-icon"
              />
            </button>
            <img
              src="<%=require('./images/avatar.png')%>"
              alt="profile avatar"
              class="profile__avatar"
              id="user-image"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name" id="user-name"></h1>
            <p class="profile__description" id="profile-description"></p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%=require('./images/pencil.svg')%>"
                class="profile__edit-icon"
                alt="pencil icon"
              />
              <span>Edit Profile</span>
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
              src="<%=require('./images/plus.svg')%>"
              alt="plus icon"
              class="profile__btn-icon"
            />
            <span>New Post</span>
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <img src="" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                  <button type="button" class="card__delete-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2024 © Spots</p>
      </footer>
      <div class="modal" id="edit-modal">
        <div class="modal__container">
          <div class="modal__header">
            <h2 class="modal__title">Edit profile</h2>
            <button
              type="button"
              id="modal-close-btn"
              class="modal__close-btn"
            ></button>
          </div>
          <form name="edit-profile" class="modal__form" novalidate>
            <label class="modal__label" for="profile-name-input">
              Name
              <input
                type="text"
                id="profile-name-input"
                placeholder="Enter your name"
                class="modal__input"
                required
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label class="modal__label" for="profile-description-input">
              Description
              <input
                type="text"
                id="profile-description-input"
                placeholder="Enter your description"
                class="modal__input"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="add-card-modal">
        <div class="modal__container">
          <div class="modal__header">
            <h2 class="modal__title">New Post</h2>
            <button
              type="button"
              id="add-modal-close-btn"
              class="modal__close-btn"
            ></button>
          </div>
          <form name="edit-profile" class="modal__form" novalidate>
            <label class="modal__label" for="add-card-link-input">
              Image Link
              <input
                type="url"
                name="link"
                id="add-card-link-input"
                placeholder="Paste a link to picture"
                class="modal__input"
                required
              />
              <span id="add-card-link-input-error" class="modal__error"></span>
            </label>
            <label class="modal__label" for="add-card-name-input">
              Caption
              <input
                type="text"
                name="name"
                id="add-card-name-input"
                placeholder="Enter your caption"
                class="modal__input"
                required
                minlength="2"
                maxlength="30"
              />
              <span id="add-card-name-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
    </div>
    <div class="modal" id="preview-modal">
      <div class="modal__content modal__content_type_preview">
        <button
          aria-label="Close modal"
          class="modal__close-btn modal__close-btn_type_preview"
          type="button"
        ></button>
        <img class="modal__image" src="" alt="" />
        <p class="modal__caption"></p>
      </div>
    </div>
    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <div class="modal__header">
          <h2 class="modal__title">Edit profile avatar</h2>

          <button
            type="button"
            id="modal-close-btn"
            class="modal__close-btn"
          ></button>
        </div>
        <form name="edit-avatar-form" class="modal__form" novalidate>
          <label class="modal__label" for="profile-avatar-input">
            Profile picture
            <input
              id="profile-avatar-input"
              name="avatar"
              placeholder="Avatar"
              class="modal__input"
              type="url"
              required
            />
            <span id="profile-avatar-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="delete-modal">
      <div class="modal__container modal__container_centered">
        <button
          aria-label="Close modal"
          class="modal__close-btn modal__close-btn_type_preview"
          type="button"
        ></button>
        <h2 class="modal__title modal__title_styled">
          Are you sure you want to delete this image?
        </h2>
        <form
          name="delete-form"
          class="modal__form modal__form_centered"
          novalidate
        >
          <button
            type="button"
            class="modal__submit-btn modal__submit_delete-btn"
          >
            Delete
          </button>
          <button type="button" id="modal-delete-close-btn" class="modal__cancel-btn">
            Cancel
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
